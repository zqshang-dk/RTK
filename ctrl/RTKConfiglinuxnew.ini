# 卫星导航程序配置文件
# 每一项使用“参数名=参数值”的格式
# 路径中有空格或中文时，建议使用英文双引号

PositionMode  2      # 定位模式：1=单点定位SPP，2=实时动态差分RTK
IsFileData    0      # 数据输入方式：1=文件模式，0=网络模式
RTKProcMode   2      # RTK解算方式：1=EKF，2=最小二乘
RovPort       3       # 流动站串口参数，目前文件模式下不会使用
RovBaud       115200

# 基站和流动站的网络参数，文件模式下不会使用
BasNetIP      47.114.134.129
RovNetIP      8.148.22.229
BasNetPort    7190
RovNetPort    7201

CodeNoise      0.3      # 伪距观测噪声，单位为米
CarrierNoise   0.01     # 载波相位观测噪声，单位为米
ElevThreshold  15.0     # 卫星截止高度角，单位为度
RatioThres     3.0      # LAMBDA整数模糊度固定的Ratio阈值

SPPObsDatFile  /mnt/d/course/RTK/data/oem_original/oem719-202603111200.bin  #单点定位原始观测文件
BasObsDatFile  /mnt/d/course/RTK/data/short_baseline_data/oem719-202510271500-base.bin  #RTK基站
RovObsDatFile  /mnt/d/course/RTK/data/short_baseline_data/oem719-202510271500-rover.bin  #RTK流动站
ResFile        /mnt/d/Course/RTK/output/temp.txt       # 定位结果输出文件
