# 卫星导航程序配置文件
# 每一项使用“参数名=参数值”的格式
# 路径中有空格或中文时，建议使用英文双引号

# 定位模式：1=单点定位SPP，2=实时动态差分RTK
PositionMode=2

# 数据输入方式：1=文件模式，0=网络模式
IsFileData=0

# RTK解算方式：1=EKF，2=最小二乘
RTKProcMode=1

# 流动站串口参数，目前文件模式下不会使用
RovPort=3
RovBaud=115200

# 基站和流动站的网络参数，文件模式下不会使用
BasNetIP=47.114.134.129
RovNetIP=8.148.22.229
BasNetPort=7190
RovNetPort=7201

# 伪距和载波相位观测噪声，单位为米
CodeNoise=1.0
CarrierNoise=0.01

# 卫星截止高度角，单位为度
ElevThreshold=15.0

# LAMBDA整数模糊度固定的Ratio阈值
RatioThres=3.0

# 单点定位原始观测文件，仅PositionMode=1时使用
SPPObsDatFile="D:\Course\RTK\data\oem_original\oem719-202603111200.bin"

# RTK基站和流动站原始观测文件，仅PositionMode=2时使用
BasObsDatFile="D:\Course\RTK\data\short_baseline_data\oem719-202510271500-base.bin"
RovObsDatFile="D:\Course\RTK\data\short_baseline_data\oem719-202510271500-rover.bin"

# 定位结果输出文件
ResFile="D:\Course\RTK\output\position_result.txt"
